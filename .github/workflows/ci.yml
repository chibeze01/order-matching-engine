name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitized:
    name: Debug + sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache CMake build (FetchContent deps)
        uses: actions/cache@v4
        with:
          path: build/debug-asan
          key: ${{ runner.os }}-debug-asan-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-debug-asan-

      - name: Configure
        run: cmake --preset debug-asan

      - name: Build
        run: cmake --build --preset debug-asan

      - name: Test
        run: ctest --preset debug-asan

  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache CMake build (FetchContent deps)
        uses: actions/cache@v4
        with:
          path: build/release
          key: ${{ runner.os }}-release-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-release-

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          files=$(find engine sim gateway bench \
            -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.cc' \))
          if [ -z "$files" ]; then
            echo "No C++ sources to check."
            exit 0
          fi
          echo "$files"
          clang-format --dry-run --Werror $files
